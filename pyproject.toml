[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatif"
version = "0.1.0"
description = "A simulated Twin of Germany that Backtests national vote intention."
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
whatif = "whatif.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
